[project]
name = "pokerstars-converter"
version = "0.1.0"
description = "Convert PokerStars hand-history logs into compact factual poker notation."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Denys Obukhov" }
]
keywords = ["poker", "pokerstars", "hand-history", "converter", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
]
dependencies = []

[project.scripts]
pokerstars-converter = "pokerstars_converter.converter:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pokerstars_converter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
